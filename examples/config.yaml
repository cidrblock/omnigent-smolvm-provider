# A managed smolvm profile. Add under `sandbox.providers` in the Omnigent
# config, then launch with `provider: smolvm-default`.
sandbox:
  providers:
    - provider: smolvm-default
      # The managed host reaches the server through the guest gateway, which
      # only exists on virtio-net. `block_private` closes CGNAT too, so the
      # gateway subnet has to be re-opened explicitly.
      server_url: http://100.96.0.1:6767
      smolvm-default:
        # A `docker save` archive of an image with the omnigent CLI in it, or a
        # registry reference such as ghcr.io/you/omnigent-host:fedora-1.
        image: /home/me/.omnigent/sandbox/smolvm/omnigent-host-fedora-1.tar
        cpus: 4
        memory_mib: 8192
        net_backend: virtio-net
        block_private: true
        allow_private: ["100.96.0.0/30"]
        # A published host port is machine-global: smolvm will not start a
        # second machine on a port a running one already holds. Do not declare
        # `ports:` on a shared profile; ask for a per-session slice instead and
        # the provider picks free ports at provision time. Both keys go
        # together, and host port == guest port for each one.
        dynamic_port_range: [30000, 40000]
        dynamic_port_count: 10
        # The L7 policy: hostnames, resolved in the host-side network stack.
        # Unlisted names do not resolve and bare IPs have no route. `*.d` does
        # not cover the apex, so a domain usually needs both forms.
        allow_hosts: ["api.github.com"]
        allow_host_patterns: ["pypi.org", "*.pypi.org"]
        # smolvm mounts directories only. Single files (AGENTS.md, gitconfig,
        # ssh keys) are staged into one directory and copied over / once, on
        # the machine's first start.
        mounts:
          - {source: /home/me/repo, target: /root/repo, mode: rw}
          - {source: /home/me/.omnigent/sandbox/smolvm/root,
             target: /root/.omnigent-sandbox, mode: ro}
        init:
          - cp -a /root/.omnigent-sandbox/. / && chown -R root:root /root/workspace
        # References only: smolvm reads each value on the host at machine
        # start. keychain items are `secret-tool lookup service omnigent
        # account <name>`; env:/file: are the other two sources.
        secrets:
          - {env_var: GH_TOKEN, keychain: omnigent/github}
          - {env_var: GIT_TOKEN, keychain: omnigent/github}
        # Forward the host's SSH agent instead of mounting keys.
        ssh_agent: false
        # Keep a value out of the guest entirely: the host substitutes it into
        # a header for these hosts only. The host must also pass the egress
        # policy above.
        # credentials:
        #   - {name: jira, env_var: JIRA_TOKEN, keychain: omnigent/jira,
        #      hosts: ["api.atlassian.com"]}
        agent_workspace: true
        agent_workspace_root: /home/me/agent_work
        # Not set on purpose: a per-sandbox state dir re-imports the image for
        # every machine. Set it only when stronger isolation is worth that.
        # state_dir_root: /home/me/.local/share/omnigent/smolvm
