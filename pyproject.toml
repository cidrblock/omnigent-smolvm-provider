[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-smolvm-provider"
version = "0.1.0"
description = "Hardware-isolated smolvm microVM sandbox provider for Omnigent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "omnigent>=0.19.1,<0.21",
  "pydantic>=2",
  "PyYAML>=6",
]

[project.entry-points."omnigent.sandbox_providers"]
smolvm = "omnigent.community.sandbox.smolvm.plugin:get_contribution"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnigent.community.sandbox.smolvm*"]
namespaces = true
